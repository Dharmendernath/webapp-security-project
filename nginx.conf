server {
    listen 80;
    server_tokens off;

    location / {
# BEGIN ANSIBLE MANAGED SECURITY HEADERS
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
# END ANSIBLE MANAGED SECURITY HEADERS
        proxy_pass http://juice-shop:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Strip Juice Shop's own headers so ours aren't duplicated
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;

        # BEGIN ANSIBLE MANAGED SECURITY HEADERS
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        # END ANSIBLE MANAGED SECURITY HEADERS
    }
}
